name: Pulse
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/pulse.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pulse.svg assets/pulse-light.svg
          git diff --cached --quiet || git commit -m "pulse: daily refresh"
          git push
